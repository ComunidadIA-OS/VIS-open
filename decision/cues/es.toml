# Pistas de género en el lenguaje, español. PENDIENTE DE VALIDAR POR IVETTE.
# Palabras genéricas de la lengua (tratamientos, cargos, concordancias), escritas por el equipo:
# nada de listas de nombres propios. Para otro idioma, copia este fichero a <idioma>.toml.
# Se comparan sin tildes ni mayúsculas. Género: mujer / hombre; solo se atribuye por lenguaje,
# nunca por la cara, la voz o el tono.
language = "es"

[confidence]
# Por debajo de 0,7 (REVIEW_CONFIDENCE_THRESHOLD) la voz queda `desconocido` y va a revisión.
floor_grant = 0.85    # «tiene la palabra la señora X» (lo dice otra persona, p. ej. la Presidencia)
self_role = 0.9       # «soy la diputada…», «soy el portavoz…»
self_agreement = 0.75 # «estoy agradecida / agradecido…»
floor_grant_same_voice = 0.6  # la diarización juntó a la Presidencia con quien habla
as_role = 0.6         # «como diputada…»: puede ser una cita o un tercero, así que se revisa
chair_address = 0.8   # la Presidencia acaba con un tratamiento a solas: «Señora ministra.»

[floor_grant]
# Frases con las que quien preside da la palabra; el género se lee en las palabras que siguen.
phrases = [
  "tiene la palabra",
  "tiene usted la palabra",
  "tiene el uso de la palabra",
  "puede intervenir",
  "puede usted intervenir",
  "tiene la palabra para",
  # Sesión de control: la Presidencia anuncia la pregunta y quien la formula.
  "pregunta de la diputada",
  "pregunta del diputado",
  "formula la diputada",
  "formula el diputado",
]
lookahead_tokens = 12   # palabras tras la frase donde buscar el tratamiento
max_gap_s = 30          # la voz atribuida debe hablar como mucho este tiempo después

[question_start]
# Sesión de control: frases con las que la Presidencia abre una pregunta nueva. Si una sesión
# las tiene, cada pregunta empieza solo aquí (no en «tiene la palabra», que también se usa para
# la réplica). Si no las tiene (otros debates), se usan las de [floor_grant].
# Comprobado en los Diarios de Sesiones de 19/09/2018, 05/10/2022 y 30/09/2026: 20, 19 y 17.
phrases = [
  "pregunta de la diputada",
  "pregunta del diputado",
  "pregunta de la senora",
  "pregunta del senor",
  "pregunta tambien",
  "siguiente pregunta",
  "siguientes preguntas",
  "ultima pregunta",
  "primera pregunta",
  "primeras preguntas",
  # «La pregunta se la formula el diputado don…» (2026) y la variante de Whisper «la fórmula del…».
  "formula el diputado",
  "formula la diputada",
  "formula del diputado",
  "formula de la diputada",
  # 2018: «Pregunta también a la señora ministra de la diputada doña…».
  "tambien a la senora",
  "tambien al senor",
]

[chair]
# Solo en las intervenciones de la Presidencia (la voz que más veces da la palabra o anuncia
# preguntas). El género es el de la voz que habla justo después.
# Anuncio de 2018: «Pregunta también dirigida al señor presidente del diputado don X».
announce_phrases = ["del diputado", "de la diputada"]
# Sesión de control: da paso con un tratamiento a solas al final de su intervención
# («Señora ministra, cuando quiera.», «Señor presidente del Gobierno.»). No cuenta si la frase
# lleva «gracias» (se dirige a quien acaba de hablar) ni si pasa de este número de palabras.
address_max_tokens = 6
address_fillers = ["adelante", "cuando", "quiera", "usted", "por", "favor", "puede", "ya"]

[address]
woman = ["senora", "dona"]
man = ["senor", "don"]

[roles]
woman = [
  "diputada", "senadora", "ministra", "presidenta", "vicepresidenta", "secretaria",
  "consejera", "alcaldesa", "concejala", "eurodiputada", "compañera", "letrada",
  "directora", "parlamentaria", "candidata", "delegada",
]
man = [
  "diputado", "senador", "ministro", "presidente", "vicepresidente", "secretario",
  "consejero", "alcalde", "concejal", "eurodiputado", "compañero", "letrado",
  "director", "parlamentario", "candidato", "delegado",
]
# Cargos sin forma propia: el género sale del artículo («la portavoz», «el ponente»).
epicene = ["portavoz", "ponente", "testigo", "periodista"]
articles_woman = ["la", "una"]
articles_man = ["el", "un"]

[self_reference]
# «soy / estoy…» + adjetivo con concordancia de género sobre quien habla.
verbs = ["soy", "estoy", "me siento", "me encuentro", "me considero", "quedo", "me quedo"]
adverbs = ["muy", "tan", "realmente", "especialmente", "profundamente", "bastante", "sumamente"]
# pares [mujer, hombre]
adjectives = [
  ["agradecida", "agradecido"], ["encantada", "encantado"], ["orgullosa", "orgulloso"],
  ["convencida", "convencido"], ["contenta", "contento"], ["preocupada", "preocupado"],
  ["satisfecha", "satisfecho"], ["sorprendida", "sorprendido"], ["honrada", "honrado"],
  ["emocionada", "emocionado"], ["decepcionada", "decepcionado"], ["dispuesta", "dispuesto"],
  ["obligada", "obligado"], ["segura", "seguro"], ["cansada", "cansado"],
]
# Introducción de un cargo propio: «soy (la/el) <cargo>» y «como (la/el) <cargo>».
self_role_verbs = ["soy"]
as_role_words = ["como"]

[pseudonymize]
# Palabras con mayúscula a mitad de frase que NO son nombres de persona (instituciones, lugares,
# partidos...). Cualquier otra palabra con mayúscula a mitad de frase se sustituye por un código:
# es mejor redactar de más que dejar un nombre. Amplíala si algo útil se redacta sin querer.
keep = [
  "Pregunta", "Preguntas",  # «Pregunta también a…» no es un apellido
  "España", "Cataluña", "Catalunya", "Galicia", "Euskadi", "Valencia", "Madrid", "Barcelona",
  "Andalucía", "Europa", "Unión", "Europea", "Gobierno", "Congreso", "Senado", "Estado", "Cortes",
  "Generales", "Constitución", "Presidencia", "Diputación", "Permanente", "Comisión", "Pleno",
  "Ministerio", "Comunidad", "Comunidades", "Autónomas", "Autónoma", "Ayuntamiento", "Junta",
  "Grupo", "Parlamentario", "Parlamentaria", "Mixto", "Popular", "Socialista", "Podemos", "Sumar",
  "Vox", "Esquerra", "Republicana", "Junts", "Bildu", "Partido", "PP", "PSOE", "PNV", "ERC",
  "Seguridad", "Social", "Hacienda", "Economía", "Sanidad", "Educación", "Justicia", "Interior",
  "Real", "Decreto", "Decreto-ley", "Ley", "Orgánica", "Boletín", "Oficial", "Diario", "Sesiones",
  "DANA", "Oriente", "Medio", "Valenciana", "Mazón", "Plan", "Integral", "Respuesta", "Crisis",
  "Señorías", "Señoría", "Dios", "Navidad", "Europeo", "Banco", "Central", "Mundial", "Ibex",
]

# Palabras que, solas como frase («Gracias.», «Presidente.»), NO se redactan. Cualquier otra
# palabra suelta con mayúscula como frase entera se trata como un apellido y se sustituye.
common = [
  "Gracias", "Muchas", "Muchísimas", "Bueno", "Bien", "Vale", "Claro", "Perfecto", "Adelante",
  "Entonces", "También", "Además", "Después", "Antes", "Ahora", "Hoy", "Aquí", "Allí", "Sí", "No",
  "Pues", "Pero", "Porque", "Cuando", "Mientras", "Señorías", "Señoría", "Presidente", "Presidenta",
  "Silencio", "Votación", "Gracias", "Hola", "Buenos", "Buenas", "Días", "Tardes", "Noches", "Ruego",
  "Termino", "Concluyo", "Finalizo", "Acabo", "Perdón", "Disculpe", "Atención", "Orden", "Cierro",
  "Fin", "Final", "Nada", "Todo", "Todos", "Todas", "Nunca", "Siempre", "Quizás", "Gobierno",
]
