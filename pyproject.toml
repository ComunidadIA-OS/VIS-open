[project]
name = "vis-open"
version = "0.1.0"
description = "Mujeres por la IA Abierta: análisis local de la participación de las mujeres en debates en vídeo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.6", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
# Dependencias pesadas del pipeline (torch llega como dependencia transitiva).
# Se instalan en la VM de OVH; los tests se saltan si faltan.
pipeline = [
    "faster-whisper>=1.2",
    "whisperx>=3.8; python_version < '3.14'",
    "pyannote.audio>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts", "pipeline", "metrics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
